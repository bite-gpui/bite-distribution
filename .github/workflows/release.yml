# Publish one target's crates to crates.io — one lineage, one branch, one version.
#
# Dispatch only, and the reason is which repository this is. The `bite_*` tags live
# in the *source* repository, `bite-gpui/bite-gpui`; a `push: tags` trigger here
# would watch *this* repository, where those tags never appear. A trigger that
# cannot fire is worse than none, so a release starts one of two ways: `tag.yml` in
# this repository, which resolves the branch to its tag, pushes the tag to the
# source repository and dispatches this workflow; or this workflow's own dispatch,
# for a dry run, for a target whose tag already exists, or for a rolling target
# that has no tag at all. Wanting release-on-tag means putting the trigger in the
# source repository, where the tags are, dispatching this one.
#
# crates.io versions are immutable, so the real path is fenced twice: a dispatch
# must ask for it and repeat the target name, and the publish job waits on the
# `crates-io` environment, which is where the token lives and where required
# reviewers belong. A single `registry-publish` concurrency group means two
# releases never overlap. The token is a repository/Environment secret and never
# reaches a pull request, because this workflow has no pull-request trigger.
#
# **Verification is not part of this workflow**, but a verification is required.
# It stages and publishes; the checks a staged tree has to pass belong to
# `verify.yml`, which leaves a receipt named `verified-<target>-<version>` when
# it is dispatched. `prepare` refuses a real publish without one:
#
#     gh workflow run verify.yml -f target=bite_v1.21.0
#
# Keeping the checks out of this workflow is what makes it good for iterating on
# the publisher itself — a missing token, a rate limit, a crate whose manifest
# crates.io rejects — where the minutes they take are the thing being waited on
# and not what is being tested. `require_verify: false` publishes without the
# receipt, for when the receipt itself is what is broken; it says so loudly.
#
# A target may declare that it can only be published in part, with
# `allow_partial` in `targets.toml`. `publish.py` refuses a release that loses
# crates to withholding, because a partial upload cannot be withdrawn, and that
# declaration is what turns the refusal off for a lineage that cannot be
# published whole — ce, whose `wgsl-rs` dependency has no registry version. It
# is a property of the target rather than a dispatch input for the same reason a
# target's version is: it does not change between runs.
name: Release

run-name: ${{ github.event.inputs.dry_run == 'false' && format('Release {0}', github.event.inputs.target) || format('Dry run {0}', github.event.inputs.target) }}

on:
  workflow_dispatch:
    inputs:
      # A `choice` list, not free text: it is the branches of the source repository,
      # and `pipeline/targets.py --validate` fails if it and the table ever disagree.
      target:
        description: 'target to release (a branch of bite-gpui/bite-gpui)'
        type: choice
        options:
          - bite_v1.22.0-pre
          - bite_v1.21.0
          - bite_v1.21.0-pre
          - bite_v1.20.2
          - bite_v1.19.x
          - bite_v1.18.x
          - bite_v1.17.x
          - bite_v1.16.x
          - bite_v1.15.x
          - bite_v1.14.x
          - bite_master
          - bite_ce_main
          - bite_v1.22.0
          - bite_v1.23.0-pre
          - bite_v1.23.1-pre
        required: true
      confirm:
        description: 'repeat the target name to confirm a real publish'
        required: false
        default: ''
      dry_run:
        description: 'stage and package without uploading'
        type: boolean
        required: false
        default: true
      only:
        description: 'publish only these crates, comma-separated — the resume after one of them failed'
        required: false
        default: ''
      require_verify:
        description: 'refuse to publish without a verification receipt (uncheck to publish anyway)'
        type: boolean
        required: false
        default: true

# Stable and preview uploads share one crates.io namespace, and the release
# targets share crate names, so two releases must never overlap.
concurrency:
  group: registry-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # See ci.yml: no debug information, so the link step fits on a runner.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read
  # Reading the verification receipt back: it is an artifact on this repository.
  actions: read

jobs:
  prepare:
    name: resolve the target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      repository: ${{ steps.resolve.outputs.repository }}
      branch: ${{ steps.resolve.outputs.branch }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
      # An output is unambiguously available at job level, where the `inputs`
      # context is not, so the inputs the publish job needs are passed through.
      only: ${{ inputs.only }}
      # From the table, not a dispatch input: whether a target can be published
      # whole is a property of the target (targets.toml). `prepare` resolves it
      # with the rest and the publish reads it here.
      allow_partial: ${{ steps.resolve.outputs.allow_partial }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate the table
        run: python3 pipeline/targets.py --validate

      - name: Resolve the target
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Emits target=, repository=, branch=, lineage=, upstream=,
          # amendment=, allow_partial= and version= for $GITHUB_OUTPUT.
          python3 pipeline/targets.py --env "$INPUT_TARGET" >> "$GITHUB_OUTPUT"

      - name: Refuse an unconfirmed publish
        if: inputs.dry_run == false && inputs.confirm != inputs.target
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target }}
        run: |
          echo "confirm ($CONFIRM) does not match target ($TARGET)" >&2
          exit 1

      # The receipt `verify.yml` leaves when it is dispatched. Keyed by version
      # because that is the same thing as the commit here: a release target's tip
      # has to carry the tag its version names (§6), and staging refuses an
      # untagged tip. The stage report inside it records the commit, so a reviewer
      # can see which one was verified.
      #
      # A dry run is not gated: it publishes nothing, and iterating on the
      # publisher is what a dry run is for — the minutes a verification takes are
      # then the thing being waited on and not what is being tested.
      - name: Require a verification of this target
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE: ${{ inputs.require_verify }}
          TARGET: ${{ steps.resolve.outputs.target }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # Compared as a shell string because it arrives either way: a dispatch
          # boolean may be a boolean or a string.
          if [ "$REQUIRE" != "true" ]; then
            echo "::warning title=unverified release::$TARGET $VERSION will be published without a verification receipt"
            exit 0
          fi
          receipt="verified-${TARGET}-${VERSION}"
          found="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$receipt" --jq '.total_count')"
          if [ "$found" -gt 0 ]; then
            echo "::notice title=verified::$receipt is on this repository"
            exit 0
          fi
          echo "::error title=unverified::$TARGET $VERSION has no verification receipt ($receipt)." \
               "Verify it first: gh workflow run verify.yml -f target=$TARGET" \
               "Or re-dispatch with require_verify unchecked, deliberately."
          exit 1

      - name: Summarise
        env:
          MODE: ${{ inputs.dry_run }}
          TARGET: ${{ steps.resolve.outputs.target }}
          VERSION: ${{ steps.resolve.outputs.version }}
          ONLY: ${{ inputs.only }}
          ALLOW_PARTIAL: ${{ steps.resolve.outputs.allow_partial }}
        run: |
          # Compared as a shell string because it arrives either way: a dispatch
          # boolean may be a boolean or a string, and interpolating gives
          # "true"/"false" here regardless.
          if [ "$MODE" = "false" ]; then
            echo "::notice title=release::$TARGET $VERSION will be published to crates.io"
          else
            echo "::notice title=dry run::$TARGET $VERSION will be staged and packaged, not uploaded"
          fi
          if [ -n "$ONLY" ]; then
            echo "::notice title=partial release::only $ONLY will be published"
          fi
          # A different thing from `only`: withheld crates the target declares,
          # not a chosen subset of a whole release.
          if [ "$ALLOW_PARTIAL" = "true" ]; then
            echo "::warning title=withheld crates::$TARGET declares allow_partial, so a partial release is deliberate"
          fi

  publish:
    needs: prepare
    # A dispatch publishes only when it asked to. `needs` already skips this job
    # when `prepare` fails; its result is named as well because a failed job does
    # not reliably expose the outputs its earlier steps wrote.
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    # Approval gate, and where CARGO_REGISTRY_TOKEN lives. Configure the
    # environment with required reviewers: it is the last thing between a dispatch
    # and an upload, and the only place the token is reachable.
    environment: crates-io
    # A first release of a new name family is rate-limited to about four hours
    # (DESIGN §11); a new version of a name that already exists is minutes. The
    # job ceiling is six hours — stop short of it rather than be killed midway
    # through a release, which is resumable but noisy.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.branch }}
          path: src
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}

      # The published version is the version the branch tip is tagged with.
      - name: Fetch the release tags
        working-directory: src
        run: git fetch --force origin '+refs/tags/bite_*:refs/tags/bite_*'

      # The token is only visible to a job that names the environment, so this is
      # the first place it can be checked. Failing here costs seconds; failing
      # inside publish.py costs a staging run first.
      - name: Require the registry token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            exit 0
          fi
          echo "::error title=missing secret::CARGO_REGISTRY_TOKEN is empty. It belongs on" \
               "the \`crates-io\` environment (Settings -> Environments), which is the only" \
               "place this job reads it from. A hand release uses \`cargo login\`, or the same" \
               "variable in the shell."
          exit 1

      # This job compiles the closure even though nothing here looks like a build:
      # `cargo publish` verifies a release by unpacking the tarball and building it
      # as the root of its own build, which links the same system libraries the
      # checks link. Without them a build script dies rather than failing usefully
      # — 1.21.0 stopped at `yeslogic-fontconfig-sys`, whose build script unwraps a
      # `pkg-config` result for a fontconfig that was not installed. It is reached
      # through parley's `fontique`, so the crate that pays is `bite-gp-parley`, and
      # the exit is a panic (101) rather than a failed link.
      #
      # The same environment `verify.yml` stages and checks under, from one
      # definition. The cache below stays here, because its key is this job's.
      - uses: ./.github/actions/build-env

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ${{ needs.prepare.outputs.target }}

      - name: Stage
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: python3 pipeline/stage.py --target "$TARGET" --source src

      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ needs.prepare.outputs.target }}
          path: src/dist-stage.json

      # Even a real publish starts with `publish.py --dry-run`'s packaging, so a
      # manifest crates.io would reject is found here rather than mid-release.
      #
      # The token comes from the secret, not from a `cargo login` on a developer
      # machine: a release is then reproducible from the tag alone, and no local
      # credential file is needed or shared.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TARGET: ${{ needs.prepare.outputs.target }}
          ONLY: ${{ needs.prepare.outputs.only }}
          # The withheld crates a target declares (targets.toml). Without this
          # `publish.py` refuses a target that loses crates to withholding, which
          # is the right default: a partial upload cannot be withdrawn.
          ALLOW_PARTIAL: ${{ needs.prepare.outputs.allow_partial }}
        run: |
          set -o pipefail
          args=(--stage src)
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          if [ "$ALLOW_PARTIAL" = "true" ]; then
            echo "::warning title=withheld crates::$TARGET publishes a partial closure by declaration"
            args+=(--allow-partial)
          fi
          python3 pipeline/publish.py "${args[@]}" 2>&1 | tee publish.log

      # A rate-limited first release is interrupted more often than it fails, so
      # the log is the thing to read: it names the crate that stopped the run and
      # the time the next attempt is allowed, which is what `--only <crate>`
      # resumes from.
      - name: Keep the publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ needs.prepare.outputs.target }}
          path: publish.log
          if-no-files-found: ignore
