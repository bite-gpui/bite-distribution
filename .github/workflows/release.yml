# Publish one target's crates to crates.io — one lineage, one branch, one version.
#
# Dispatch only, and the reason is which repository this is. The `bite_*` tags live
# in the *source* repository, `bite-gpui/bite-gpui`; a `push: tags` trigger here
# would watch *this* repository, where those tags never appear. A trigger that
# cannot fire is worse than none, so a release starts one of two ways: `tag.yml` in
# this repository, which resolves the branch to its tag, pushes the tag to the
# source repository and dispatches this workflow; or this workflow's own dispatch,
# for a dry run, for a target whose tag already exists, or for a rolling target
# that has no tag at all. Wanting release-on-tag means putting the trigger in the
# source repository, where the tags are, dispatching this one.
#
# crates.io versions are immutable, so the real path is fenced twice: a dispatch
# must ask for it and repeat the target name, and the publish job waits on the
# `crates-io` environment, which is where the token lives and where required
# reviewers belong. A single `registry-publish` concurrency group means two
# releases never overlap. The token is a repository/Environment secret and never
# reaches a pull request, because this workflow has no pull-request trigger.
#
# `skip_verify` opens a third way in, deliberately: it publishes a staged tree
# without running the verification suite, for iterating on the publisher itself —
# a missing token, a rate limit, a crate whose manifest crates.io rejects — where
# the minutes `verify` takes are the thing being waited on and not what is being
# tested. It is off by default, refused on a dry run (where verification *is* the
# work), still fenced by the confirmation input and the environment's reviewers,
# and named in the run's title so an unverified release is obvious in the list.
name: Release

run-name: ${{ github.event.inputs.skip_verify == 'true' && format('Release {0} — UNVERIFIED', github.event.inputs.target) || format('Release {0}', github.event.inputs.target) }}

on:
  workflow_dispatch:
    inputs:
      # A `choice` list, not free text: it is the branches of the source repository,
      # and `pipeline/targets.py --validate` fails if it and the table ever disagree.
      target:
        description: 'target to release (a branch of bite-gpui/bite-gpui)'
        type: choice
        options:
          - bite_v1.22.0-pre
          - bite_v1.21.0
          - bite_v1.21.0-pre
          - bite_v1.20.2
          - bite_v1.19.x
          - bite_v1.18.x
          - bite_v1.17.x
          - bite_v1.16.x
          - bite_v1.15.x
          - bite_v1.14.x
          - bite_master
          - bite_ce_main
        required: true
      confirm:
        description: 'repeat the target name to confirm a real publish'
        required: false
        default: ''
      dry_run:
        description: 'package and verify without uploading'
        type: boolean
        required: false
        default: true
      skip_verify:
        description: 'publish without verification — for iterating on crates.io itself, not for a release'
        type: boolean
        required: false
        default: false
      only:
        description: 'publish only these crates, comma-separated — the resume after one of them failed'
        required: false
        default: ''

# Stable and preview uploads share one crates.io namespace, and the release
# targets share crate names, so two releases must never overlap.
concurrency:
  group: registry-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # See ci.yml: no debug information, so the link step fits on a runner.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  prepare:
    name: resolve the target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      repository: ${{ steps.resolve.outputs.repository }}
      branch: ${{ steps.resolve.outputs.branch }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
      # Passed through as outputs rather than read from `inputs` in the jobs that
      # need them: an output is unambiguously available at job level.
      skip_verify: ${{ inputs.skip_verify }}
      only: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate the table
        run: python3 pipeline/targets.py --validate

      - name: Resolve the target
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Emits target=, repository=, branch=, lineage=, upstream=,
          # amendment= and version= for $GITHUB_OUTPUT.
          python3 pipeline/targets.py --env "$INPUT_TARGET" >> "$GITHUB_OUTPUT"

      - name: Refuse an unconfirmed publish
        if: inputs.dry_run == false && inputs.confirm != inputs.target
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target }}
        run: |
          echo "confirm ($CONFIRM) does not match target ($TARGET)" >&2
          exit 1

      - name: Refuse to skip verification on a dry run
        env:
          SKIP: ${{ inputs.skip_verify }}
          DRY: ${{ inputs.dry_run }}
        run: |
          # Compared as shell strings, as the summary below does: whether a
          # dispatch boolean arrives as a boolean or as a string, interpolating
          # it here yields "true" or "false" either way.
          if [ "$SKIP" = "true" ] && [ "$DRY" = "true" ]; then
            echo "skip_verify is for a real publish. On a dry run verification is the" >&2
            echo "whole work, so the two together are refused rather than quietly doing" >&2
            echo "only one of them." >&2
            exit 1
          fi

      - name: Say so when verification is skipped
        env:
          SKIP: ${{ inputs.skip_verify }}
          DRY: ${{ inputs.dry_run }}
          TARGET: ${{ steps.resolve.outputs.target }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [ "$SKIP" = "true" ] && [ "$DRY" != "true" ]; then
            echo "::warning title=unverified release::$TARGET $VERSION will be published without verification"
          fi

      - name: Summarise
        env:
          MODE: ${{ inputs.dry_run }}
          TARGET: ${{ steps.resolve.outputs.target }}
          VERSION: ${{ steps.resolve.outputs.version }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "$MODE" = "false" ]; then
            echo "::notice title=release::$TARGET $VERSION will be published to crates.io"
          else
            echo "::notice title=dry run::$TARGET $VERSION will be staged and verified, not uploaded"
          fi
          if [ -n "$ONLY" ]; then
            echo "::notice title=partial release::only $ONLY will be published"
          fi

  verify:
    needs: prepare
    # Stated rather than left to `needs` alone: a job that has a condition runs
    # after a failed dependency unless the condition itself says otherwise.
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip_verify == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.branch }}
          path: src
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}

      # The published version is the version the branch tip is tagged with.
      - name: Fetch the release tags
        working-directory: src
        run: git fetch --force origin '+refs/tags/bite_*:refs/tags/bite_*'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned to the toolchain the branches were built and verified with;
          # see rust-toolchain.toml.
          toolchain: '1.95.0'
          components: clippy

      # See ci.yml: the registry and git caches are shared across targets
      # because their lockfiles differ but their dependencies do not.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ${{ needs.prepare.outputs.target }}

      - name: Stage
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: python3 pipeline/stage.py --target "$TARGET" --source src

      - name: Record the version being released
        id: version
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          version="$(python3 -c "import json;print(json.load(open('src/dist-stage.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice title=$TARGET::staged $TARGET as $version"

      - uses: ./.github/actions/verify
        with:
          stage: src

      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ needs.prepare.outputs.target }}
          path: src/dist-stage.json

  publish:
    needs: [prepare, verify]
    # A dispatch publishes when it asked to *and* has a verification behind it —
    # one that passed, or one it deliberately skipped. The condition is explicit
    # because a job that has one is not stopped by a failed dependency the way a
    # job without one is, and publishing after a failed verification is the one
    # outcome that has to be impossible.
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.dry_run == 'false' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Approval gate, and where CARGO_REGISTRY_TOKEN lives. Configure the
    # environment with required reviewers: it is the last thing between a dispatch
    # and an upload, and the only place the token is reachable.
    environment: crates-io
    # A first release of a new name family is rate-limited to about four hours
    # (DESIGN §11); a new version of a name that already exists is minutes. The
    # job ceiling is six hours — stop short of it rather than be killed midway
    # through a release, which is resumable but noisy.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.branch }}
          path: src
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}

      - name: Fetch the release tags
        working-directory: src
        run: git fetch --force origin '+refs/tags/bite_*:refs/tags/bite_*'

      # The token is only visible to a job that names the environment, so this is
      # the first place it can be checked. Failing here costs seconds; failing
      # inside publish.py costs a staging run first.
      - name: Require the registry token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            exit 0
          fi
          echo "::error title=missing secret::CARGO_REGISTRY_TOKEN is empty. It belongs on" \
               "the \`crates-io\` environment (Settings -> Environments), which is the only" \
               "place this job reads it from. A hand release uses \`cargo login\`, or the same" \
               "variable in the shell."
          exit 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ${{ needs.prepare.outputs.target }}

      - name: Stage
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: python3 pipeline/stage.py --target "$TARGET" --source src

      # Deliberately not the verify action: it ran on this commit, or was skipped
      # deliberately, and re-running the tests here would hold the registry lock
      # for the length of a full build. This is also the only place the registry
      # token is exposed, and this job is the only one that names the `crates-io`
      # environment.
      #
      # The token comes from the secret, not from a `cargo login` on a developer
      # machine: a release is then reproducible from the tag alone, and no local
      # credential file is needed or shared.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TARGET: ${{ needs.prepare.outputs.target }}
          ONLY: ${{ needs.prepare.outputs.only }}
        run: |
          set -o pipefail
          args=(--stage src)
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          python3 pipeline/publish.py "${args[@]}" 2>&1 | tee publish.log

      # A rate-limited first release is interrupted more often than it fails, so
      # the log is the thing to read: it names the crate that stopped the run and
      # the time the next attempt is allowed, which is what `--only <crate>`
      # resumes from.
      - name: Keep the publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ needs.prepare.outputs.target }}
          path: publish.log
          if-no-files-found: ignore
