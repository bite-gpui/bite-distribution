name: Token check

# Temporary diagnostic: says what SOURCE_WRITE_TOKEN is and whether it can write
# the source repository. Non-mutating: the push is a --dry-run.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Inspect the token
        env:
          TOKEN: ${{ secrets.SOURCE_WRITE_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "SOURCE_WRITE_TOKEN is empty"
            exit 1
          fi

          echo "=== identity ==="
          curl -sS -D headers.txt -o body.json \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/user
          python3 -c 'import json;d=json.load(open("body.json"));print("login:",d.get("login"));print("message:",d.get("message"))' || true

          echo "=== token-kind headers ==="
          grep -iE 'x-oauth-scopes|x-accepted-oauth-scopes|github-authentication-token-expiration|www-authenticate' headers.txt || echo "(none)"

          echo "=== read the source repository ==="
          GIT_TERMINAL_PROMPT=0 git ls-remote \
            "https://x-access-token:${TOKEN}@github.com/bite-gpui/bite-gpui.git" HEAD \
            && echo "read: ok" || echo "read: FAILED"

          echo "=== write check (dry run, no ref is created) ==="
          # A fresh repository: the workspace checkout persists actions-checkout's
          # own auth header, which would win over the URL credentials and test the
          # workflow token instead of the secret.
          rm -rf probe && mkdir probe && cd probe
          git init -q
          git config user.email release-check@example.invalid
          git config user.name release-check
          echo probe > probe.txt
          git add probe.txt && git commit -qm probe
          GIT_TERMINAL_PROMPT=0 git push --dry-run \
            "https://x-access-token:${TOKEN}@github.com/bite-gpui/bite-gpui.git" \
            HEAD:refs/heads/token-check-dry-run 2>&1 \
            && echo "write: ok" || echo "write: FAILED"
