# The pull-request entry point, for callers in another repository.
#
# `verify.yml` verifies a *target*: it resolves repository, branch and version from
# the target table by name, then stages the branch. Staging rewrites `[package]
# version` to the version the branch's release tag names, and `pipeline/targets.py`
# refuses an untagged tip — so a pull request, whose head is by definition not the
# tagged tip of a release branch, cannot go through it. What a pull request *can*
# run is the part of the pipeline that reads the tree rather than the tag: the
# target table and the naming rule, which are `ci.yml`'s `table` job.
#
# It is `workflow_call` so a repository that does not carry the checks can run them
# from its own pull requests. A called workflow inherits its caller's `github`
# context, and that was measured on the first caller rather than assumed — three
# consequences this file is written around:
#
#   * The call itself is allowed. A public repository may call another public
#     repository's `workflow_call` workflow with no token and no secret.
#   * A checkout with no inputs checks out the *caller's* repository, not this one.
#     Anything that needs this repository's files has to check this repository out
#     explicitly.
#   * A `./`-relative `uses:` resolves against that caller checkout, so
#     `uses: ./.github/actions/build-env` fails here with "Can't find 'action.yml'".
#     The repository-local composite actions are not reachable from this file, which
#     is why it uses none of them and calls `pipeline/` and `checks/` by path.
name: Pull request checks

on:
  workflow_call:
    inputs:
      repository:
        description: 'the repository under test, the caller'
        required: true
        type: string
      ref:
        description: 'the commit under test, the caller'
        required: true
        type: string
      platforms:
        description: 'runner label'
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  table:
    name: target table and naming rule
    runs-on: ${{ inputs.platforms }}
    steps:
      # The scripts, from this repository's default branch. The entry point itself is
      # resolved from whatever ref the caller names — a branch until this file is
      # merged, which is a different commit from the default branch's — so a script
      # this file calls has to be on the default branch already. Nothing here is
      # newly added to `pipeline/`, so that holds today and after the merge.
      - name: Check out the checks
        uses: actions/checkout@v5
        with:
          repository: bite-gpui/distribution
          path: .dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The commit under test, standing in for one lineage. The naming rule reads a
      # lineage's closure, which is branch-invariant across that lineage's release
      # lines — that is why `ci.yml` can check one branch per lineage instead of all
      # twelve targets — so the pull request's own tree is the right input for the
      # lineage it belongs to.
      - name: Check out the tree under test
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: src/zed

      - name: Validate the target table
        run: python3 .dist/pipeline/targets.py --validate

      # The rule is verified across the whole table, so the other lineage needs a
      # checkout too — not the pull request's tree, but the branch the table names.
      # `--refs --select ce` is where that branch is written down; `ci.yml` reads it
      # the same way.
      - name: Resolve the community-edition branch
        id: lineages
        run: python3 .dist/pipeline/targets.py --refs --select ce >> "$GITHUB_OUTPUT"

      - name: Check out the community-edition source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.lineages.outputs.repository }}
          ref: ${{ steps.lineages.outputs.ce }}
          path: src/ce

      - name: Verify published names
        run: |
          python3 .dist/pipeline/naming.py --verify \
            --lineage-repo zed=src/zed \
            --lineage-repo ce=src/ce
