# Tag a release branch, then publish it.
#
# The manual way in. It resolves a `bite_*` branch to its target, derives the tag
# from the table (the tag *is* the version), refuses a branch whose tip moved under
# an existing tag, pushes the tag to the source repository, and dispatches the
# publish workflow.
#
# It has to dispatch rather than let a tag trigger do it, and for a second reason
# beyond GITHUB_TOKEN's recursion rule: the `bite_*` tags live in the *source*
# repository, and `release.yml` lives in this one, so a `push: tags` trigger there
# would be watching the wrong repository and could never fire. This workflow exists
# precisely so the tag ends up in the right place and the release still starts.
#
# The secrets: SOURCE_WRITE_TOKEN needs `contents: write` on the source
# repository, because this workflow pushes to a repository it does not live in.
# GITHUB_TOKEN cannot: it is scoped to this repository. The registry token is not
# here — the publish it dispatches still runs behind the `crates-io` environment,
# which is where an upload gets approved.
name: Tag

on:
  workflow_dispatch:
    inputs:
      # A `choice` list, not free text: these are the branches of the source
      # repository, `bite-gpui/bite-gpui`, and `targets.py --validate` fails if the
      # list and the table ever disagree. Newest line first, so the default is the
      # one most likely meant — and `dry_run` defaults to true, so a wrong pick
      # still does not push anything.
      branch:
        description: 'branch of bite-gpui/bite-gpui to tag and publish'
        type: choice
        options:
          - bite_v1.22.0-pre
          - bite_v1.21.0
          - bite_v1.21.0-pre
          - bite_v1.20.2
          - bite_v1.19.x
          - bite_v1.18.x
          - bite_v1.17.x
          - bite_v1.16.x
          - bite_v1.15.x
          - bite_v1.14.x
          - bite_master
          - bite_ce_main
        required: true
      force:
        description: 'proceed when the tip is already tagged: publishing a version not yet uploaded, or re-publishing a botched release'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'resolve and report only — do not push a tag or publish'
        type: boolean
        required: false
        default: true

# One tagging run at a time: two runs against one branch would race to create the
# same tag, and the publish they both dispatch is already serialised by
# release.yml's own `registry-publish` group.
concurrency:
  group: release-tag
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: write   # dispatch the release workflow

jobs:
  tag:
    name: tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate the table and resolve the branch
        id: resolve
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          python3 targets.py --validate
          python3 targets.py --for-branch "$BRANCH" >> "$GITHUB_OUTPUT"

      # The branch itself, checked out with a token that can also push to it.
      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.resolve.outputs.repository }}
          ref: ${{ steps.resolve.outputs.branch }}
          path: src
          token: ${{ secrets.SOURCE_WRITE_TOKEN }}

      # All of the judgement is in the script, which is why it is testable
      # locally: `--repo` names the checkout, `--remote` the repository to ask
      # about existing tags, and omitting `--push` reports without touching
      # anything.
      - name: Resolve the tag, and push it unless this is a dry run
        id: tag
        env:
          BRANCH: ${{ inputs.branch }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--branch "$BRANCH" --repo src)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$DRY_RUN" != "true" ]; then args+=(--push); fi
          python3 tag_release.py "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        env:
          TARGET: ${{ steps.tag.outputs.target }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          STATE: ${{ steps.tag.outputs.state }}
          TIP: ${{ steps.tag.outputs.tip }}
        run: |
          {
            echo "### ${TARGET:-unknown target}"
            echo
            echo "- version: \`${VERSION:-?}\`"
            echo "- tag: ${TAG:-none (rolling target)}"
            echo "- state: \`${STATE:-unknown}\`"
            echo "- tip: \`${TIP:-?}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the publish
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.tag.outputs.target }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main \
            -f target="$TARGET" -f confirm="$TARGET" -f dry_run=false
          echo "dispatched release.yml for $TARGET"
