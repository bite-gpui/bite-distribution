# Verify a pull request against the target table, the naming rule, and one
# staged target per lineage.
#
# The full twelve targets are not verified here. Each one is a cold build of gpui
# and its backends, so twelve of them on every push is hours of CI for a change to
# a script. `default` is one target per lineage; dispatch with `all` when the
# change is one that could affect every branch.
#
# Verifying a release target is not this file's job. The `stage` job calls
# `verify.yml`, which is the one definition of what verifying a target means, and
# dispatch that file directly to verify a target before a release
# (`-f target=bite_v1.21.0`): a dispatched run there also leaves the receipt
# `release.yml` reads, and a call from here does not.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: 'which targets to stage: default, all, zed, ce, or a comma-separated list'
        required: false
        default: default
      platforms:
        description: 'runner labels, comma-separated: ubuntu-latest, or add macos-14 to compile the Apple backends'
        required: false
        default: ubuntu-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The branch sets `debug = "limited"` in `[profile.dev]`, and a debug build of
  # the whole closure exhausted the runner's disk while linking: the linker died
  # with a bus error, which on Linux means it ran out of space for its output.
  # Debug information is worth nothing here — nothing gets debugged and the
  # artifacts are thrown away — and turning it off shrinks those links by
  # roughly an order of magnitude.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  table:
    name: target table and naming rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate the target table
        run: python3 pipeline/targets.py --validate

      - name: Resolve the reference branches
        id: refs
        # One branch per lineage, which is enough to exercise the naming rule; a
        # crate that arrives on another branch is caught when that branch is
        # staged, because pipeline/stage.py fails on a crate it has no name for.
        run: python3 pipeline/targets.py --refs --select default >> "$GITHUB_OUTPUT"

      - name: Check out the source branch
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.refs.outputs.repository }}
          ref: ${{ steps.refs.outputs.zed }}
          path: .src/zed
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - name: Check out the community-edition source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.refs.outputs.repository }}
          ref: ${{ steps.refs.outputs.ce }}
          path: .src/ce
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}

      - name: Verify published names
        run: |
          python3 pipeline/naming.py --verify \
            --lineage-repo zed=.src/zed \
            --lineage-repo ce=.src/ce

  # The workflow files are code, and this is the only thing that reads them the way
  # GitHub does. It runs before `plan` so a wiring mistake — an input that no longer
  # exists, an output that never did — fails in seconds rather than after the matrix
  # has spent minutes staging a target that cannot publish.
  lint:
    name: CI wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # `checks/workflows.py` fetches actionlint itself, verified against a
      # checksum pinned in it. It needs PyYAML, which the runner's Python does not
      # carry, for the pass over the actions' own `inputs:` and `outputs:`.
      - name: Lint the CI wiring
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'pyyaml==6.*'
          python3 checks/workflows.py

  plan:
    needs: [table, lint]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: matrix
        run: |
          matrix="$(python3 pipeline/targets.py --matrix --select '${{ inputs.targets || 'default' }}' --platforms '${{ inputs.platforms || 'ubuntu-latest' }}')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Staging and verification are `verify.yml`'s, called rather than copied: this
  # job is the matrix over targets and runner labels, and that file is the one
  # definition of what verifying a target means. A pull request stages a target;
  # it does not leave the receipt a release reads.
  stage:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/verify.yml
    with:
      target: ${{ matrix.target }}
      platforms: ${{ matrix.os }}
    secrets: inherit
