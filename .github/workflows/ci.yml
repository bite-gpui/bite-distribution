# Verify a pull request against the target table, the naming rule, and one
# staged target per lineage.
#
# The full twelve targets are not verified here. Each one is a cold build of gpui
# and its backends, so twelve of them on every push is hours of CI for a change to
# a script. `default` is one target per lineage; dispatch with `all` when the
# change is one that could affect every branch.
#
# This is also the only place a release target is verified: `release.yml` stages
# and publishes and runs no checks, so a release rests on a dispatch of this
# workflow for the same target (`-f targets=bite_v1.21.0`).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: 'which targets to stage: default, all, zed, ce, or a comma-separated list'
        required: false
        default: default
      platforms:
        description: 'runner labels, comma-separated: ubuntu-latest, or add macos-14 to compile the Apple backends'
        required: false
        default: ubuntu-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The branch sets `debug = "limited"` in `[profile.dev]`, and a debug build of
  # the whole closure exhausted the runner's disk while linking: the linker died
  # with a bus error, which on Linux means it ran out of space for its output.
  # Debug information is worth nothing here — nothing gets debugged and the
  # artifacts are thrown away — and turning it off shrinks those links by
  # roughly an order of magnitude.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

jobs:
  table:
    name: target table and naming rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate the target table
        run: python3 pipeline/targets.py --validate

      - name: Resolve the reference branches
        id: refs
        # One branch per lineage, which is enough to exercise the naming rule; a
        # crate that arrives on another branch is caught when that branch is
        # staged, because pipeline/stage.py fails on a crate it has no name for.
        run: python3 pipeline/targets.py --refs --select default >> "$GITHUB_OUTPUT"

      - name: Check out the source branch
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.refs.outputs.repository }}
          ref: ${{ steps.refs.outputs.zed }}
          path: .src/zed
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - name: Check out the community-edition source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.refs.outputs.repository }}
          ref: ${{ steps.refs.outputs.ce }}
          path: .src/ce
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}

      - name: Verify published names
        run: |
          python3 pipeline/naming.py --verify \
            --lineage-repo zed=.src/zed \
            --lineage-repo ce=.src/ce

  # The workflow files are code, and this is the only thing that reads them the way
  # GitHub does. It runs before `plan` so a wiring mistake — an input that no longer
  # exists, an output that never did — fails in seconds rather than after the matrix
  # has spent minutes staging a target that cannot publish.
  lint:
    name: CI wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # `checks/workflows.py` fetches actionlint itself, verified against a
      # checksum pinned in it. It needs PyYAML, which the runner's Python does not
      # carry, for the pass over the actions' own `inputs:` and `outputs:`.
      - name: Lint the CI wiring
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'pyyaml==6.*'
          python3 checks/workflows.py

  plan:
    needs: [table, lint]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: matrix
        run: |
          matrix="$(python3 pipeline/targets.py --matrix --select '${{ inputs.targets || 'default' }}' --platforms '${{ inputs.platforms || 'ubuntu-latest' }}')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  stage:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.branch }}
          path: src
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}

      # pipeline/stage.py reads the manifests with tomllib, which is 3.11 and later; the
      # runner's own python3 is too old for that on macOS.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The published version is the version the branch tip is tagged with, so a
      # depth-1 checkout is enough — but the tags still have to be fetched, and
      # fetching only ours keeps it small.
      - name: Fetch the release tags
        working-directory: src
        run: git fetch --force origin '+refs/tags/bite_*:refs/tags/bite_*'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned to the toolchain the branches were built and verified with.
          # Floating stable is how a run failed on a lint that did not exist
          # when the code was written; see rust-toolchain.toml.
          toolchain: '1.95.0'
          components: clippy

      # Dependency downloads dominated the first few runs. Different targets
      # have different lockfiles, so the build cache cannot be shared, but the
      # crates themselves overlap almost completely — so the registry and git
      # caches are keyed only on the lockfile and shared through the fallback.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Stage
        run: python3 pipeline/stage.py --target '${{ matrix.target }}' --source src

      - uses: ./.github/actions/verify
        with:
          stage: src

      - name: Keep the stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.target }}-${{ matrix.os }}
          path: src/dist-stage.json
          if-no-files-found: ignore
