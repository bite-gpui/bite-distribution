# The build environment: what compiling the closure needs, in one place.
#
# One action because it used to be two, and they drifted. `verify.yml` installed
# the Linux system packages, python and the pinned toolchain; the release job
# installed only the toolchain — so `cargo publish`, which verifies a release by
# building the packaged crate as the root of its own build, compiled the closure
# without fontconfig, and `yeslogic-fontconfig-sys`'s build script panicked on a
# `pkg-config` result instead of failing usefully.
#
# Nothing here is a check. It is the prerequisite for compiling at all, which is why
# it sits beside `verify` rather than inside it: the checks are `verify.yml`'s and
# should not run in a release, but a system library that compilation links is needed
# by anything that compiles — including a job whose visible work is an upload.
#
# The caches are not here. Their keys are per-target, and the registry cache's key
# is a lockfile hash, which does not exist until the source has been checked out —
# later than this has to run.
name: Prepare the build environment
description: Install the system packages, python and the pinned toolchain that compiling the closure needs

inputs:
  components:
    description: 'rustup components for callers that need them, comma-separated (e.g. clippy)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Its own action because its list has its own provenance — the union of what
    # ce's publish job installs and what zed's `script/linux` installs for
    # Debian/Ubuntu — which is worth being able to read and change on its own.
    - uses: ./.github/actions/linux-deps

    - uses: actions/setup-python@v5
      with:
        # pipeline/stage.py reads the manifests with tomllib, which is 3.11 and
        # later; a runner's own python3 is too old for that on macOS.
        python-version: '3.13'

    # Pinned to the toolchain the branches were built and verified with. Floating
    # stable is how a run failed on a lint that did not exist when the code was
    # written; see rust-toolchain.toml.
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.95.0'
        components: ${{ inputs.components }}
