# The closure, compiled and tested.
#
# Feature set: `--all-features`. The migration project checked the closure twice,
# once with default features and once with all of them, and only the all-features
# build compiles the code behind `bench-support` and `profiler`. Checking with
# default features alone reports that code as dead — which is how this was found,
# on `gpui_authoring::Window::present_if_needed`, whose only callers are in
# `bench_context` and `profiler::hang`.
#
# Clippy *is* the compile. It type-checks the same `--all-targets --all-features`
# set that a plain `cargo check` would and adds the lints on top, so a separate
# check step would compile every workspace crate a second time and report nothing
# the lints do not. The lint set is what makes a step named "check" worth having;
# `cargo check` on its own was not.
name: Check and test the closure
description: Lint and test the closure's crates, with all features

inputs:
  stage:
    description: path to the staged checkout (the tree pipeline/stage.py mutated in place)
    required: true
  native:
    description: space-separated crates to lint, from preflight's `native` output
    required: true
  tested:
    description: space-separated crates to test, from preflight's `tested` output
    required: true
  test:
    description: run the closure's tests
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Clippy
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        read -ra packages <<< "${{ inputs.native }}"
        args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
        cargo clippy "${args[@]}" --all-targets --all-features -- -D warnings

    # `--lib --tests`, not `--all-targets`: the default selection for `cargo
    # test` also builds every example, and the facade declares twenty-five of
    # them, each linking the whole stack in a debug profile. That is what killed
    # the link step of an earlier run with a bus error, which on Linux means the
    # linker ran out of address space for its output. Examples are still
    # type-checked, by the clippy step above.
    #
    # The list is `tested`, not `native`: a crate whose dev-dependencies cannot be
    # resolved is packaged without verification and has no tests to run.
    - name: Test
      if: inputs.test == 'true'
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        read -ra packages <<< "${{ inputs.tested }}"
        args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
        cargo test "${args[@]}" --all-features --lib --tests
