# The published artifacts, built the way a consumer receives them.
name: Build the published artifacts
description: Dry-run every crate as a package root, then compile the unpacked archives with no siblings

inputs:
  stage:
    description: path to the staged checkout (the tree pipeline/stage.py mutated in place)
    required: true
  isolated:
    description: compile the unpacked archives in a directory with no siblings
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The dry run packages each crate and compiles it as the root of a build,
    # which is the only check that the published artifact builds. Resolving a
    # root's dev-dependencies is part of that, which is why the crates in
    # `no_verify` are packaged without it. Withheld crates are skipped here and
    # refused at release time.
    - name: Publish dry run
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: python3 "$GITHUB_WORKSPACE/pipeline/publish.py" --stage . --dry-run

    # The closing check. `cargo publish --dry-run` compiles each tarball as the
    # root of a build, which resolves the package's dev-dependencies and is why
    # the crates in `no_verify` are published without verification at all —
    # nothing else in the pipeline looks inside their archive. This does: it
    # unpacks every publishable crate and compiles a crate that depends on all of
    # them, which is what a consumer resolves. `gpui_apple` is in `no_verify`, and
    # this is the step that fails on its archive.
    - name: Isolated build
      if: inputs.isolated == 'true'
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: python3 "$GITHUB_WORKSPACE/checks/test_isolated.py" --stage .
