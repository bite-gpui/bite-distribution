# The gate a target must pass before any of its crates is published.
#
# Used by both workflows so that "the release workflow runs the same checks as a
# pull request" holds by construction rather than by review. The target repo is
# expected to be checked out, tagged and staged before this runs.
#
# Feature set: `--all-features`. The migration project gated the closure twice,
# once with default features and once with all of them, and only the all-features
# build compiles the code behind `bench-support` and `profiler`. Checking with
# default features alone reports that code as dead — which is how this was found,
# on `gpui_authoring::Window::present_if_needed`, whose only callers are in
# `bench_context` and `profiler::hang`.
name: Gate a staged target
description: Resolve, check, lint, test, package-check and dry-run a staged target

inputs:
  stage:
    description: path to the staged checkout (the tree stage.py mutated in place)
    required: true
  test:
    description: run the closure's tests
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The union of what ce's publish job installs and what zed's own
    # `script/linux` installs for Debian/Ubuntu. ce's list alone is not enough:
    # it was assembled for packaging rather than for linking test binaries, and
    # the first gate run died at the linker with `unable to find library
    # -lX11-xcb` while linking `gpui_macros`'s `render_test`, which pulls the
    # whole stack. zed's script/linux is the source of truth for the rest; its
    # gtk and webkit entries are for the editor crates, which the closure does
    # not contain.
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev libegl1-mesa-dev libfontconfig-dev libgit2-dev \
          libglib2.0-dev libgles2-mesa-dev libssl-dev libsqlite3-dev \
          libva-dev libvulkan1 libvulkan-dev libwayland-dev \
          libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxcb-xinput-dev libzstd-dev

    - name: Read the stage report
      id: report
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        # Outputs are appended to $GITHUB_OUTPUT; annotations are printed to
        # stdout, because a workflow command written into the output file is
        # just a malformed output value.
        python3 - <<'PY'
        import json, os, pathlib
        report = json.loads(pathlib.Path("dist-stage.json").read_text())
        with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
            outputs.write("native=" + " ".join(report["native"]) + "\n")
            outputs.write("tested=" + " ".join(report.get("tested", [])) + "\n")
            outputs.write("wasm=" + " ".join(report.get("wasm_only", [])) + "\n")
        for entry in report.get("blocked", []):
            print(f"::warning title=withheld::{entry['published']} is withheld: {entry['reason']}")
        for name in report.get("wasm_only", []):
            print(f"::notice title=wasm-only::{name} is not checkable natively and is excluded")
        PY

    # Resolving is not compiling, and it is far cheaper: it caught the
    # dependency-version mismatch a rename with a stale version leaves behind,
    # across the whole workspace, in seconds.
    - name: Resolve the workspace
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: cargo metadata --format-version 1 > /dev/null

    - name: Check
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        read -ra packages <<< "${{ steps.report.outputs.native }}"
        args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
        cargo check "${args[@]}" --all-targets --all-features

    - name: Clippy
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        read -ra packages <<< "${{ steps.report.outputs.native }}"
        args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
        cargo clippy "${args[@]}" --all-targets --all-features -- -D warnings

    # `--lib --tests`, not `--all-targets`: the default selection for `cargo
    # test` also builds every example, and the facade declares twenty-five of
    # them, each linking the whole stack in a debug profile. That is what killed
    # the link step of an earlier run with a bus error, which on Linux means the
    # linker ran out of address space for its output. Examples are still
    # type-checked, by the check and clippy steps above.
    - name: Test
      if: inputs.test == 'true'
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        read -ra packages <<< "${{ steps.report.outputs.tested }}"
        args=(); for package in "${packages[@]}"; do args+=(-p "$package"); done
        cargo test "${args[@]}" --all-features --lib --tests

    # `--list` is the cheap half of packaging, and it is where a missing licence
    # or a build.rs that reads an excluded file shows up.
    - name: Package file sets
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        while read -r dir; do
          echo "--- $dir"
          cargo package --list --allow-dirty --manifest-path "$dir/Cargo.toml"
        done < <(python3 "$GITHUB_WORKSPACE/publish.py" --stage . --dirs)

    # The dry run is the closing gate: it packages each crate and compiles it
    # in isolation, which is the only check that the published artifact builds.
    # Withheld crates are skipped here and refused at release time.
    - name: Publish dry run
      shell: bash
      working-directory: ${{ inputs.stage }}
      run: python3 "$GITHUB_WORKSPACE/publish.py" --stage . --dry-run
