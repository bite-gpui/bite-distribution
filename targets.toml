# Distribution targets.
#
# One entry per branch whose crates get published. `lineage` selects the
# published-name family (see naming.py) and `version_from` the version scheme
# (see DESIGN.md §6). `roots` are the source packages the closure is walked
# from; everything else is discovered from the manifests.
#
# `version` is the upstream release a branch retargets. The version that gets
# published is derived from it, not equal to it: `1.20.2` publishes as
# `1.20.200`, leaving 201..299 for amendments to the same upstream patch and 300
# onwards for the next one. Bump `amendment` when new content has to ship for an
# upstream release that is already published.
#
# Every target lives in one repository, so it is named once here and a target
# may still override it with its own `url`. `branch` is what distinguishes a
# target. Ten of the branches descend from zed releases, `bite_master` from zed's
# main, and `bite_ce_main` from the community edition's fork point — shared
# ancestry, diverged surface, which is exactly why the lineage has to be
# declared rather than inferred.
#
# Private repositories need a read token in CI.
repository = "https://github.com/bite-gpui/bite-gpui.git"

[[target]]
name = "bite_v1.14.x"
repo = "."
branch = "bite_v1.14.x"
lineage = "zed"
roots = ["gpui", "gpui_parley"]
# Upstream release the branch is built on; `version_from = "tag"` means the
# stager re-derives it and fails if the branch moved off the release.
version_from = "release-tag"
upstream = "1.14.2"
# Two fixes so far, each new content on a release branch, which DESIGN §6 charges
# the next amendment: `gpui_parley` reached outside its own directory for the
# fonts it embeds, so the tarball it packaged could not be compiled back, and
# `gpui_macos`'s build script fed cbindgen shader types it read from sibling
# crates, which a packaged `.crate` does not carry; they are vendored now.
amendment = 2

