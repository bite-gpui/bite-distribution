# Rolling tip. No upstream release tag is reachable from it, so it publishes on
# the CalVer series instead of borrowing a release number it does not have.
[[target]]
name = "bite_master"
url = "https://github.com/Vanuan/bite-gpui.git"
repo = ".tools/wt-master"
branch = "bite_master"
lineage = "zed"
roots = ["gpui", "gpui_parley"]
version_from = "calver"

# The community-edition lineage shares the main repository and publishes the
# `bite-gp-ce-*` family, with `bite-gpui-ce` as its facade.
[[target]]
name = "bite_ce_main"
url = "https://github.com/Vanuan/bite-gpui.git"
repo = ".tools/wt-ce"
branch = "bite_ce_main"
lineage = "ce"
roots = ["gpui-ce", "gpui_parley"]
version_from = "calver"
